<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>擦除查看（Scratch to Reveal）Demo</title>
  <style>
    :root{--maxw: 900px;}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif;
      background:#0e0e10;
      color:#e8e8ea;
    }
    .wrap{max-width:var(--maxw);margin:24px auto;padding:0 16px;}
    h1{font-size:20px;margin:0 0 12px;}
    .toolbar{display:flex;gap:.75rem;align-items:center;margin:.5rem 0 12px;}
    .toolbar label{display:flex;gap:.5rem;align-items:center;opacity:.9}
    .toolbar button{
      padding:.4rem .75rem;
      border:0;
      border-radius:.5rem;
      background:#2b2b31;
      color:#fff;
      cursor:pointer;
    }
    .toolbar button:hover{background:#3a3a43}
    #stage{
      position:relative;
      width:100%;
      aspect-ratio:16/9;
      background:#111;
      user-select:none;
      touch-action:none;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 6px 24px rgba(0,0,0,.35)
    }
    #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
    .hint{opacity:.75;margin-top:8px;font-size:14px}
    .footer{opacity:.55;font-size:12px;margin-top:14px}
    a{color:#9ecbff}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>擦除查看（Scratch to Reveal）</h1>
    <div class="toolbar">
      <label>笔刷半径
        <input id="brush" type="range" min="10" max="120" value="48">
      </label>
      <button id="reset" type="button">重置</button>
      <button id="toggle" type="button">一键全显/全隐</button>
      <span id="pct" style="margin-left:auto;opacity:.8;">已擦除 0%</span>
    </div>

    <div id="stage">
      <canvas id="cv"></canvas>
    </div>

    <div class="hint">
      在画面上拖动/触摸即可“擦除”显示底图。<br>
      你可以在仓库中新建 <code>img</code> 文件夹并放入 <code>base.jpg</code> 和 <code>top.png</code>，
      这两个文件会被自动加载。
    </div>
    <div class="footer">
      适用于桌面与移动端；无外部依赖，可直接托管到 GitHub Pages/Netlify/Vercel。
    </div>
  </div>

  <script>
  (function(){
    // === 从本仓库相对路径加载（不跨域） ===
    const BASE_URL = "./img/base.jpg"; // 底图
    const TOP_URL  = "./img/top.jpg";  // 上层图

    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const stage = document.getElementById('stage');
    const brush = document.getElementById('brush');
    const btnReset = document.getElementById('reset');
    const btnToggle = document.getElementById('toggle');
    const pct = document.getElementById('pct');

    let baseImg = new Image(), topImg = new Image();
    let drawing=false, lastX=0, lastY=0, revealed=false;

    function dpr(){ return window.devicePixelRatio || 1; }

    function fitCanvas(){
      const r = dpr();
      const rect = stage.getBoundingClientRect();
      cv.width = Math.round(rect.width * r);
      cv.height = Math.round(rect.height * r);
      ctx.setTransform(r,0,0,r,0,0);
    }

    function drawCover(img){
      const rect = stage.getBoundingClientRect();
      const W = rect.width, H = rect.height;
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const cr = W/H, ir = iw/ih;
      let dw, dh, dx, dy;
      if (ir > cr) { dh = H; dw = ih * cr; dx = (W - dw)/2; dy = 0; }
      else { dw = W; dh = iw / cr; dx = 0; dy = (H - dh)/2; }
      ctx.drawImage(img, dx, dy, dw, dh);
    }

    function paintAll(){
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0,0,cv.width,cv.height);
      drawCover(topImg);
      ctx.globalCompositeOperation = 'destination-over';
      drawCover(baseImg);
      updatePercent();
    }

    function getPos(e){
      const rect = cv.getBoundingClientRect();
      const p = (e.touches && e.touches[0]) || e;
      return {
        x: Math.max(0, Math.min(rect.width,  p.clientX - rect.left)),
        y: Math.max(0, Math.min(rect.height, p.clientY - rect.top))
      };
    }

    function start(e){
      e.preventDefault();
      drawing=true;
      const {x,y}=getPos(e);
      lastX=x; lastY=y;
      eraseDot(x,y);
    }

    function move(e){
      if(!drawing) return;
      const {x,y}=getPos(e);
      ctx.save();
      ctx.globalCompositeOperation='destination-out';
      ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.lineWidth=Number(brush.value);
      ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(x,y); ctx.stroke();
      ctx.restore();
      lastX=x; lastY=y;
    }

    function end(){ drawing=false; throttleUpdate(); }

    function eraseDot(x,y){
      ctx.save();
      ctx.globalCompositeOperation='destination-out';
      ctx.beginPath();
      ctx.arc(x,y,Number(brush.value)/2,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    function toggleAll(){
      const rect = stage.getBoundingClientRect();
      ctx.globalCompositeOperation='source-over';
      if(!revealed){
        ctx.clearRect(0,0,rect.width,rect.height);
        revealed=true;
      }else{
        paintAll();
        revealed=false;
      }
      updatePercent();
    }

    // 估算擦除比例
    function updatePercent(){
      const r=dpr();
      const w=Math.floor(cv.width/r),h=Math.floor(cv.height/r);
      const step=8;
      const data=ctx.getImageData(0,0,w,h).data;
      let transparent=0,total=0;
      for(let y=0;y<h;y+=step){
        for(let x=0;x<w;x+=step){
          const a=data[((y*w)+x)*4+3];
          total++; if(a<8) transparent++;
        }
      }
      const per=Math.round(transparent/total*100);
      pct.textContent=`已擦除 ${per}%`;
    }
    const throttleUpdate=throttle(updatePercent,200);
    function throttle(fn,delay){
      let t=0; return(...args)=>{const n=performance.now();if(n-t>delay){t=n;fn(...args);}};
    }

    // 事件
    cv.addEventListener('pointerdown',start);
    cv.addEventListener('pointermove',move);
    window.addEventListener('pointerup',end);
    cv.addEventListener('touchstart',start,{passive:false});
    cv.addEventListener('touchmove',move,{passive:false});
    cv.addEventListener('touchend',end);
    window.addEventListener('resize',()=>{fitCanvas();paintAll();});
    btnReset.addEventListener('click',()=>{revealed=false;fitCanvas();paintAll();});
    btnToggle.addEventListener('click',toggleAll);

    // 图片加载
    function showError(which,url){
      console.error(`图片加载失败: ${which} (${url})`);
      pct.textContent='❌ 图片加载失败';
    }
    let loaded=0;
    const onload=()=>{if(++loaded===2){fitCanvas();paintAll();}};
    baseImg.onload=onload; topImg.onload=onload;
    baseImg.onerror=()=>showError('底图',BASE_URL);
    topImg.onerror=()=>showError('上层',TOP_URL);
    baseImg.src=BASE_URL;
    topImg.src=TOP_URL;
  })();
  </script>
</body>
</html>
