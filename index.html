<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>擦除查看（爱心笔刷）</title>
  <style>
    :root{--maxw: 900px;}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif;
      background:#0e0e10;color:#e8e8ea;
    }
    .wrap{max-width:var(--maxw);margin:24px auto;padding:0 16px;}
    h1{font-size:20px;margin:0 0 12px;}
    .toolbar{display:flex;gap:.75rem;align-items:center;margin:.5rem 0 12px;}
    .toolbar label{display:flex;gap:.5rem;align-items:center;opacity:.9}
    .toolbar button{
      padding:.4rem .75rem;border:0;border-radius:.5rem;
      background:#2b2b31;color:#fff;cursor:pointer
    }
    .toolbar button:hover{background:#3a3a43}
    #stage{
      position:relative;width:100%;
      /* aspect-ratio 将在图片加载后动态设置为 base 的比例 */
      background:#111;user-select:none;touch-action:none;
      border-radius:12px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.35)
    }
    #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
    a{color:#9ecbff}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>擦除查看（爱心笔刷）</h1>
    <div class="toolbar">
      <label>笔刷大小
        <input id="brush" type="range" min="16" max="160" value="72">
      </label>
      <button id="reset" type="button">重置</button>
      <button id="toggle" type="button">一键全显/全隐</button>
      <span id="pct" style="margin-left:auto;opacity:.8;">已擦除 0%</span>
    </div>

    <div id="stage">
      <canvas id="cv"></canvas>
    </div>
  </div>

  <script>
  (function(){
    // === 同仓库相对路径（不跨域） ===
    const BASE_URL = "./img/base.jpg"; // 底图（例如 700x1024 竖图）
    const TOP_URL  = "./img/top.jpg";  // 上层（被擦除显示底图；可换成 ./img/top.png）

    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const stage = document.getElementById('stage');
    const brush = document.getElementById('brush');
    const btnReset = document.getElementById('reset');
    const btnToggle = document.getElementById('toggle');
    const pct = document.getElementById('pct');

    const baseImg = new Image();
    const topImg  = new Image();

    let drawing=false, lastX=0, lastY=0, revealed=false;
    let baseRatio = 16/9; // 将在底图加载后改成 base 的自然宽高比

    function dpr(){ return window.devicePixelRatio || 1; }

    // 根据容器 CSS 尺寸与 DPR 设置画布像素尺寸
    function fitCanvas(){
      const r = dpr();
      const rect = stage.getBoundingClientRect();
      cv.width = Math.round(rect.width * r);
      cv.height = Math.round(rect.height * r);
      ctx.setTransform(r,0,0,r,0,0);
    }

    // 将图片以 "cover" 方式铺满当前画布（不变形）
    function drawCover(img){
      const rect = stage.getBoundingClientRect();
      const W = rect.width, H = rect.height;
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const cr = W/H, ir = iw/ih;
      let dw, dh, dx, dy;
      if (ir > cr) { dh = H; dw = ih * cr; dx = (W - dw)/2; dy = 0; }
      else { dw = W; dh = iw / cr; dx = 0; dy = (H - dh)/2; }
      ctx.drawImage(img, dx, dy, dw, dh);
    }

    // 初始化/重置：上层盖住、底图垫底
    function paintAll(){
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0,0,cv.width,cv.height);
      drawCover(topImg);
      ctx.globalCompositeOperation = 'destination-over';
      drawCover(baseImg);
      updatePercent();
    }

    // 在当前内容“下面”补画底图（保证擦掉 top 后能看到 base）
    function drawBaseUnder(){
      ctx.save();
      ctx.globalCompositeOperation = 'destination-over';
      drawCover(baseImg);
      ctx.restore();
    }

    //——— 爱心路径 ———
    // 以 (0,0) 为中心、size 为整体尺寸（像素），angle 为旋转角（弧度）
    function drawHeartPath(size){
      const s = size/2; // 尺度控制
      ctx.beginPath();
      // 经典两段贝塞尔心形（上尖下圆）
      ctx.moveTo(0, -s*0.55);
      ctx.bezierCurveTo( s*0.9, -s*1.35,  s*1.6, -s*0.05,  0,  s*0.9);
      ctx.bezierCurveTo(-s*1.6, -s*0.05, -s*0.9, -s*1.35,  0, -s*0.55);
    }

    // 擦一个爱心（使用 destination-out 填充）
    function eraseHeart(x, y, size, angleRad){
      ctx.save();
      ctx.translate(x, y);
      if (angleRad) ctx.rotate(angleRad);
      ctx.globalCompositeOperation = 'destination-out';
      drawHeartPath(size);
      ctx.fill();
      ctx.restore();
    }

    // 在两点之间按间距“连点成线”地盖章爱心
    function stampHearts(x1, y1, x2, y2){
      const size = Number(brush.value);
      const dx = x2 - x1, dy = y2 - y1;
      const dist = Math.hypot(dx, dy) || 0.0001;
      const step = size * 0.6; // 印章间距（越小越密）
      const steps = Math.max(1, Math.floor(dist / step));
      const angle = Math.atan2(dy, dx); // 沿轨迹方向轻微旋转
      for (let i = 0; i <= steps; i++){
        const t = i / steps;
        const x = x1 + dx * t;
        const y = y1 + dy * t;
        eraseHeart(x, y, size, angle);
      }
      drawBaseUnder(); // 补画底图
    }

    function getPos(e){
      const rect = cv.getBoundingClientRect();
      const p = (e.touches && e.touches[0]) || e;
      return {
        x: Math.max(0, Math.min(rect.width,  p.clientX - rect.left)),
        y: Math.max(0, Math.min(rect.height, p.clientY - rect.top))
      };
    }

    function start(e){
      e.preventDefault();
      drawing = true;
      const {x,y} = getPos(e);
      lastX = x; lastY = y;
      eraseHeart(x, y, Number(brush.value), 0);
      drawBaseUnder();
    }

    function move(e){
      if (!drawing) return;
      const {x,y} = getPos(e);
      stampHearts(lastX, lastY, x, y);
      lastX = x; lastY = y;
    }

    function end(){
      drawing = false;
      throttleUpdate();
    }

    function toggleAll(){
      const rect = stage.getBoundingClientRect();
      ctx.globalCompositeOperation='source-over';
      if(!revealed){
        ctx.clearRect(0,0,rect.width,rect.height); // 全透明（等同全擦）
        revealed=true;
      }else{
        paintAll(); revealed=false;
      }
      updatePercent();
    }

    // 估算擦除比例（降采样）
    function updatePercent(){
      const r = dpr();
      const w = Math.floor(cv.width / r), h = Math.floor(cv.height / r);
      const step = 8;
      const data = ctx.getImageData(0,0,w,h).data;
      let transparent=0, total=0;
      for(let y=0;y<h;y+=step){
        for(let x=0;x<w;x+=step){
          const a = data[((y*w)+x)*4 + 3];
          total++; if(a < 8) transparent++;
        }
      }
      const per = Math.round(transparent/total*100);
      pct.textContent = `已擦除 ${per}%`;
    }
    const throttleUpdate = (function(){ let t=0; return function(){ const n=performance.now(); if(n-t>200){ t=n; updatePercent(); } }; })();

    // 事件绑定
    cv.addEventListener('pointerdown', start);
    cv.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
    cv.addEventListener('touchstart', start, {passive:false});
    cv.addEventListener('touchmove', move, {passive:false});
    cv.addEventListener('touchend', end);
    window.addEventListener('resize', ()=>{ fitCanvas(); paintAll(); });
    btnReset.addEventListener('click', ()=>{ revealed=false; fitCanvas(); paintAll(); });
    btnToggle.addEventListener('click', toggleAll);

    // 底图加载后，按底图自然比例设置容器 aspect-ratio
    function setAspectByBase(){
      const w = baseImg.naturalWidth || 16;
      const h = baseImg.naturalHeight || 9;
      baseRatio = w / h;
      stage.style.aspectRatio = `${w} / ${h}`;
    }

    // 图片加载
    let loaded = 0;
    const onload = ()=>{
      if (++loaded === 2){
        setAspectByBase();   // 依据底图尺寸设置容器比例（如 700/1024）
        fitCanvas();
        paintAll();
      }
    };
    baseImg.onload = onload;
    topImg.onload  = onload;
    baseImg.onerror = ()=>{ pct.textContent='❌ 底图加载失败'; console.error('底图加载失败', BASE_URL); };
    topImg.onerror  = ()=>{ pct.textContent='❌ 上层加载失败'; console.error('上层加载失败', TOP_URL); };
    baseImg.src = BASE_URL;
    topImg.src  = TOP_URL;
  })();
  </script>
</body>
</html>
