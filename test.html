<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>擦除查看（Scratch to Reveal）Demo</title>
  <style>
    :root{--maxw: 900px;}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif;background:#0e0e10;color:#e8e8ea;}
    .wrap{max-width:var(--maxw);margin:24px auto;padding:0 16px;}
    h1{font-size:20px;margin:0 0 12px;}
    .toolbar{display:flex;gap:.75rem;align-items:center;margin:.5rem 0 12px;}
    .toolbar label{display:flex;gap:.5rem;align-items:center;opacity:.9}
    .toolbar button{padding:.4rem .75rem;border:0;border-radius:.5rem;background:#2b2b31;color:#fff;cursor:pointer}
    .toolbar button:hover{background:#3a3a43}
    #stage{position:relative;width:100%;aspect-ratio:16/9;background:#111;user-select:none;touch-action:none;border-radius:12px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.35)}
    #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
    .hint{opacity:.75;margin-top:8px;font-size:14px}
    .footer{opacity:.55;font-size:12px;margin-top:14px}
    a{color:#9ecbff}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>擦除查看（Scratch to Reveal）</h1>
    <div class="toolbar">
      <label>笔刷半径
        <input id="brush" type="range" min="10" max="120" value="48">
